<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--surface,#fff);border-top:3px solid var(--warm,#B5400F);border-bottom:1px solid var(--line,#DCE1E6)">
  <div style="background:var(--line-soft,#EEF1F4);border-bottom:1px solid var(--line,#DCE1E6)">
    <div style="max-width:1280px;margin:0 auto;padding:6px 32px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-3,#3C4854)">
      <span style="font-family:'IBM Plex Mono',monospace;letter-spacing:.04em;text-transform:uppercase;font-size:11px">Prototype</span>
      <div style="flex:1"></div>
      <a href="Authors.dc.html#reviewers" style="color:var(--ink-3,#3C4854)">For reviewers</a>
      <a href="Authors.dc.html#editors" style="color:var(--ink-3,#3C4854)">For editors</a>
      <a href="Authors.dc.html#librarians" style="color:var(--ink-3,#3C4854)">For librarians</a>
    </div>
  </div>
  <div style="max-width:1280px;margin:0 auto;padding:16px 32px;display:flex;align-items:center;gap:28px;flex-wrap:wrap">
    <a href="Home.dc.html" style="display:flex;align-items:center;gap:10px;color:var(--ink,#101B27);text-decoration:none">
      <span style="width:34px;height:34px;background:var(--accent-dark,#0A685C);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:20px;border-radius:2px">N</span>
      <span style="display:flex;flex-direction:column;line-height:1.1">
        <span style="font-family:'Source Serif 4',Georgia,serif;font-size:20px;font-weight:600;letter-spacing:-.01em">NextGenIQ Press</span>
      </span>
    </a>
    <div style="flex:1;min-width:280px;position:relative;z-index:40">
    <form onSubmit="{{ onSearch }}" role="search" style="display:flex;border:1px solid {{ sBorder }};border-radius:3px;overflow:hidden;height:40px;background:var(--surface,#fff);transition:box-shadow .25s ease,border-color .25s ease,transform .25s ease;box-shadow:{{ sShadow }};transform:{{ sScale }}">
      <select aria-label="Search scope" value="{{ scope }}" onChange="{{ onScope }}" style="border:0;border-right:1px solid var(--line,#DCE1E6);background:var(--surface-2,#F5F6F7);padding:0 10px;font:inherit;font-size:13px;color:var(--ink-2,#1F2A36)">
        <option value="all">All content</option>
        <option value="articles">Articles</option>
        <option value="journals">Journals</option>
        <option value="pages">Author guidance</option>
      </select>
      <input aria-label="Search" role="combobox" aria-expanded="{{ sugOpenAria }}" aria-controls="ngiq-sug" autocomplete="off" value="{{ q }}" onChange="{{ onQ }}" onFocus="{{ onFocusQ }}" onBlur="{{ onBlurQ }}" onKeyDown="{{ onKeyQ }}" placeholder="Search articles, journals, authors, DOIs" style="flex:1;border:0;padding:0 12px;font:inherit;font-size:14px;outline:none;min-width:0">
      <button type="submit" style="border:0;background:var(--accent-dark,#0A685C);color:#fff;padding:0 18px;font:inherit;font-size:14px;font-weight:500;cursor:pointer">Search</button>
    </form>
    <sc-if value="{{ sugOpen }}" hint-placeholder-val="{{ false }}">
      <div id="ngiq-sug" role="listbox" style="position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface,#fff);border:1px solid var(--line-strong,#B9C1C9);border-radius:3px;box-shadow:0 12px 32px rgba(16,27,39,.16);animation:ngiqDrop .22s ease both;overflow:hidden">
        <sc-for list="{{ sugGroups }}" as="g">
          <div style="padding:8px 0;border-bottom:1px solid var(--line-soft,#EEF1F4)">
            <span style="display:block;padding:2px 14px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted,#505C68);font-weight:600">{{ g.label }}</span>
            <sc-for list="{{ g.items }}" as="it">
              <a href="{{ it.href }}" role="option" aria-selected="{{ it.sel }}" onMouseDown="{{ it.go }}" style="display:flex;justify-content:space-between;gap:12px;padding:7px 14px;font-size:14px;color:var(--ink,#101B27);text-decoration:none;background:{{ it.bg }};animation:ngiqRise .3s ease both;animation-delay:{{ it.delay }}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.t }}</span><span style="font-size:12px;color:var(--muted,#505C68);flex-shrink:0">{{ it.meta }}</span></a>
            </sc-for>
          </div>
        </sc-for>
        <a href="{{ allHref }}" onMouseDown="{{ goAll }}" style="display:block;padding:10px 14px;font-size:13px;font-weight:500;background:var(--surface-2,#F5F6F7)">See all results for “{{ q }}” →</a>
      </div>
    </sc-if>
    </div>
    <div style="display:flex;align-items:center;gap:16px">
      <button onClick="{{ toggleDim }}" aria-pressed="{{ dimAria }}" aria-label="{{ dimLabel }}" title="{{ dimLabel }}" style="width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--line-strong,#B9C1C9);background:{{ dimBg }};color:{{ dimFg }};border-radius:3px;font:inherit;font-size:15px;line-height:1;cursor:pointer;transition:background .2s,color .2s,border-color .2s">{{ dimIcon }}</button>
      <sc-if value="{{ signedIn }}" hint-placeholder-val="{{ false }}">
        <div style="position:relative">
          <button onClick="{{ toggleMenu }}" aria-haspopup="menu" aria-expanded="{{ menuAria }}" style="display:flex;align-items:center;gap:8px;border:1px solid {{ menuBorder }};background:var(--surface,#fff);border-radius:20px;padding:3px 10px 3px 3px;font:inherit;font-size:14px;color:var(--ink-2,#1F2A36);cursor:pointer;transition:border-color .2s">
            <span style="width:30px;height:30px;border-radius:50%;background:var(--accent-soft,#E8F0FA);color:var(--accent,#1D5DA8);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">AO</span>
            <span style="font-weight:500">Amara Okafor</span>
            <span aria-hidden="true" style="font-size:10px;color:var(--muted,#505C68);transition:transform .25s;transform:{{ menuCaret }}">▼</span>
          </button>
          <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
            <div role="menu" style="position:absolute;left:{{ menuL }};right:{{ menuR }};top:calc(100% + 8px);width:280px;max-width:calc(100vw - 24px);background:var(--surface,#fff);border:1px solid var(--line-strong,#B9C1C9);border-radius:4px;box-shadow:0 12px 32px rgba(16,27,39,.16);z-index:50;animation:ngiqDrop .2s ease both;overflow:hidden">
              <div style="padding:14px 16px;border-bottom:1px solid var(--line,#DCE1E6);display:flex;gap:12px;align-items:center">
                <span style="width:40px;height:40px;border-radius:50%;background:var(--accent-soft,#E8F0FA);color:var(--accent,#1D5DA8);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0">AO</span>
                <div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px;font-weight:600;color:var(--ink,#101B27)">Dr Amara N. Okafor</span><span style="font-size:12px;color:var(--muted,#505C68);overflow:hidden;text-overflow:ellipsis">a.okafor@example.ac.uk</span><span style="font-size:11px;color:var(--muted,#505C68)">Author · Reviewer</span></div>
              </div>
              <div style="padding:6px 0;border-bottom:1px solid var(--line,#DCE1E6)">
                <sc-for list="{{ menuItems }}" as="m">
                  <a role="menuitem" href="{{ m.href }}" style="display:flex;justify-content:space-between;align-items:center;padding:9px 16px;font-size:14px;color:var(--ink-2,#1F2A36);text-decoration:none" style-hover="background:var(--surface-2,#F5F6F7);color:var(--accent,#1D5DA8)">{{ m.t }}<span style="font-size:12px;color:var(--muted,#505C68)">{{ m.meta }}</span></a>
                </sc-for>
              </div>
              <button role="menuitem" onClick="{{ signOut }}" style="width:100%;text-align:left;border:0;background:none;padding:11px 16px;font:inherit;font-size:14px;color:#A52A2A;cursor:pointer" style-hover="background:#FBEAEA">Sign out</button>
            </div>
          </sc-if>
        </div>
      </sc-if>
      <sc-if value="{{ signedOut }}" hint-placeholder-val="{{ true }}">
        <a href="SignIn.dc.html" style="font-size:14px;color:var(--ink-2,#1F2A36);font-weight:500">Sign in</a>
      </sc-if>
      <a href="Submit.dc.html" style="background:var(--accent,#1D5DA8);color:#fff;padding:9px 16px;border-radius:3px;font-size:14px;font-weight:500;text-decoration:none" style-hover="background:var(--accent-dark,#174C8A)">Submit manuscript</a>
    </div>
  </div>
  <nav aria-label="Primary" style="max-width:1280px;margin:0 auto;padding:0 32px;display:flex;gap:28px;flex-wrap:wrap">
    <sc-for list="{{ nav }}" as="item" hint-placeholder-count="7">
      <sc-if value="{{ item.active }}">
        <a href="{{ item.href }}" aria-current="page" style="padding:10px 0 11px;font-size:14px;font-weight:600;color:var(--ink,#101B27);border-bottom:3px solid var(--accent,#1D5DA8);text-decoration:none">{{ item.label }}</a>
      </sc-if>
      <sc-if value="{{ item.inactive }}">
        <a href="{{ item.href }}" style="padding:10px 0 11px;font-size:14px;font-weight:500;color:var(--ink-3,#3C4854);border-bottom:3px solid transparent;text-decoration:none" style-hover="color:var(--ink,#101B27);border-bottom:3px solid var(--line-strong,#B9C1C9)">{{ item.label }}</a>
      </sc-if>
    </sc-for>
  </nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:180},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;signedIn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { q: new URLSearchParams(location.search).get('q') || '', scope: new URLSearchParams(location.search).get('scope') || 'all' };
  componentDidMount() { this.onDoc = e => { if (this.state.menu && !e.target.closest('[role="menu"]') && !e.target.closest('[aria-haspopup="menu"]')) this.setState({ menu: false }); }; this.onEsc = e => { if (e.key === 'Escape' && this.state.menu) this.setState({ menu: false }); }; document.addEventListener('mousedown', this.onDoc); document.addEventListener('keydown', this.onEsc); }
  componentWillUnmount() { document.removeEventListener('mousedown', this.onDoc); document.removeEventListener('keydown', this.onEsc); }
  renderVals() {
    const a = this.props.active || '';
    const nav = [['Journals', 'Journals.dc.html', 'journals'], ['Articles', 'Search.dc.html?scope=articles', 'articles'], ['Books & proceedings', 'Journals.dc.html#series', 'series'], ['Calls for papers', 'Authors.dc.html#cfp', 'cfp'], ['For authors', 'Authors.dc.html', 'authors'], ['Policies', 'Authors.dc.html#policies', 'policies'], ['About', 'Home.dc.html#about', 'about']]
      .map(([label, href, k]) => ({ label, href, active: k === a, inactive: k !== a }));
    let authLS = false; try { authLS = localStorage.getItem('ngiq-auth') === '1'; } catch (e) {}
    const signedIn = !!this.props.signedIn || authLS;
    const TH = window.NGIQ_THEMES;
    if (!TH && !this.poll) this.poll = setInterval(() => { if (window.NGIQ_THEMES) { clearInterval(this.poll); this.forceUpdate(); } }, 50);
    const dimOn = TH && TH.dim ? TH.dim() : false;
    const D = window.NGIQ, q = (this.state.q || '').trim().toLowerCase(), focus = !!this.state.focus, hi = this.state.hi == null ? -1 : this.state.hi;
    let groupsRaw = [];
    if (D && q.length >= 2) {
      const m = s => s.toLowerCase().includes(q);
      const js = D.journals.filter(j => m(j.title + ' ' + j.code + ' ' + j.subject)).slice(0, 3).map(j => ({ t: j.title, meta: j.code, href: 'Journal.dc.html?j=' + j.slug }));
      const as = D.articles.filter(x => m(x.title + ' ' + x.keywords.join(' ') + ' ' + x.authors.join(' '))).slice(0, 3).map(x => ({ t: x.title, meta: D.journal(x.j).code, href: 'Article.dc.html?id=' + x.id }));
      const ps = D.pageGroups.flatMap(g => g.items).filter(([, t]) => m(t)).slice(0, 3).map(([id, t]) => ({ t, meta: 'Guidance', href: D.pageHref(id, 'ijdh') }));
      groupsRaw = [['Journals', js], ['Articles', as], ['Author guidance', ps]].filter(g => g[1].length);
    }
    const flat = []; groupsRaw.forEach(g => g[1].forEach(it => flat.push(it)));
    let ci = 0;
    const sugGroups = groupsRaw.map(([label, items]) => ({ label, items: items.map(it => { const i = ci++; return Object.assign({}, it, { sel: i === hi ? 'true' : 'false', bg: i === hi ? 'var(--accent-tint,#F5F8FC)' : 'transparent', delay: (i * 35) + 'ms', go: () => { location.href = it.href; } }); }) }));
    const sugOpen = focus && q.length >= 2;
    const allHref = 'Search.dc.html?q=' + encodeURIComponent(this.state.q || '') + '&scope=' + this.state.scope;
    const mo = !!this.state.menu;
    return {
      menuOpen: mo, menuAria: mo ? 'true' : 'false', menuCaret: mo ? 'rotate(180deg)' : 'none', menuBorder: mo ? 'var(--accent,#1D5DA8)' : 'var(--line,#DCE1E6)',
      menuL: this.state.menuLeft ? '0' : 'auto', menuR: this.state.menuLeft ? 'auto' : '0',
      toggleMenu: e => { const r = e.currentTarget.getBoundingClientRect(); this.setState(st => ({ menu: !st.menu, menuLeft: r.right < 292 })); },
      menuItems: [{ t: 'My submissions', href: 'Dashboard.dc.html', meta: '5' }, { t: 'Review invitations', href: 'Dashboard.dc.html?tab=reviewer', meta: '2' }, { t: 'Edit profile', href: 'Profile.dc.html', meta: '' }, { t: 'Notifications and alerts', href: 'Profile.dc.html#notifications', meta: '' }, { t: 'Password and security', href: 'Profile.dc.html#security', meta: '' }],
      signOut: () => { try { localStorage.setItem('ngiq-auth', '0'); } catch (e) {} location.href = 'Home.dc.html?signedout=1'; },
      dimAria: dimOn ? 'true' : 'false', dimIcon: dimOn ? '☀' : '☾', dimLabel: dimOn ? 'Switch to light mode' : 'Switch to dark mode',
      dimBg: dimOn ? 'var(--accent-dark,#0A685C)' : 'var(--surface,#fff)', dimFg: dimOn ? '#fff' : 'var(--ink-2,#1F2A36)',
      toggleDim: () => { if (TH) { TH.setDim(!dimOn); this.forceUpdate(); } },
      nav, signedIn, signedOut: !signedIn,
      q: this.state.q, scope: this.state.scope,
      onQ: e => this.setState({ q: e.target.value, hi: -1 }),
      onFocusQ: () => this.setState({ focus: true }), onBlurQ: () => setTimeout(() => this.setState({ focus: false }), 150),
      onKeyQ: e => { const n = flat.length; if (e.key === 'ArrowDown' && n) { e.preventDefault(); this.setState({ hi: (hi + 1) % n }); } else if (e.key === 'ArrowUp' && n) { e.preventDefault(); this.setState({ hi: (hi - 1 + n) % n }); } else if (e.key === 'Escape') this.setState({ focus: false }); else if (e.key === 'Enter' && hi >= 0 && flat[hi]) { e.preventDefault(); location.href = flat[hi].href; } },
      sBorder: focus ? 'var(--accent,#1D5DA8)' : 'var(--line-strong,#B9C1C9)', sShadow: focus ? '0 0 0 3px color-mix(in srgb,var(--accent,#1D5DA8) 18%,transparent),0 6px 18px rgba(16,27,39,.10)' : 'none', sScale: focus ? 'scale(1.01)' : 'none',
      sugOpen, sugOpenAria: sugOpen ? 'true' : 'false', sugGroups, allHref, goAll: () => { location.href = allHref; },
      onScope: e => this.setState({ scope: e.target.value }),
      onSearch: e => { e.preventDefault(); location.href = 'Search.dc.html?q=' + encodeURIComponent(this.state.q) + '&scope=' + this.state.scope; }
    };
  }
}
</script>
</body>
</html>
